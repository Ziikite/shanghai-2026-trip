  --blue-tint:#F1F7FF; --blue-wash:rgba(54,143,255,.07);
  --canvas:#FFFFFF; --surface:#F5F6F7;
  --heading:#1B1D1F; --body:#3A3E41; --secondary:#7E848A; --tertiary:#ADB1B5;
  --border:#E8EAEC; --border-strong:#D5D8DB;

  --sh-subtle:0 1px 3px rgba(0,0,0,.04); --sh-hover:0 4px 12px rgba(0,0,0,.08);

  color-scheme:light;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{

  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; color:var(--heading)}
p{margin:0}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:720px; margin:0 auto; padding-inline:var(--sp-base)}

.topbar{

  background:color-mix(in srgb, var(--canvas) 92%, transparent);

}
.topbar-in{display:flex; align-items:center; gap:var(--sp-md); padding-block:var(--sp-md) var(--sp-sm)}
.brand-name{font-size:19px; font-weight:700; color:var(--heading); letter-spacing:-.01em; white-space:nowrap}
.brand-dates{font-size:13px; color:var(--secondary); white-space:nowrap; margin-top:1px}

.tabs{display:flex; gap:var(--sp-sm); overflow-x:auto; -webkit-overflow-scrolling:touch; padding-block:0 var(--sp-md); scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; min-height:40px; padding:9px 16px; border-radius:var(--r-pill); border:1px solid transparent;
  background:var(--surface); color:var(--body); font-size:14px; font-weight:600; cursor:pointer;
  white-space:nowrap; transition:background .15s var(--ease-standard),color .15s;
}
.tab:hover{background:var(--border)}
.tab[aria-selected="true"]{background:var(--blue-wash); color:var(--primary); border-color:var(--primary)}
.tab:focus-visible,.btn-primary:focus-visible,.btn:focus-visible,.chk:focus-visible{outline:2px solid var(--primary); outline-offset:2px}

main{padding-block:var(--sp-xl) 64px}
.panel{display:flex; flex-direction:column; gap:var(--sp-xl)}

/* ---------- hero ---------- */
.hero h1{font-size:32px; font-weight:700; line-height:1.3; letter-spacing:-.015em}
.hero-sub{margin-top:var(--sp-sm); color:var(--secondary); font-size:16px; line-height:1.5}
.btn-primary{
  display:inline-flex; align-items:center; gap:8px; margin-top:var(--sp-lg);
  height:56px; padding:0 28px; border-radius:var(--r-pill); border:0;
  background:var(--primary); color:#fff; font-size:18px; font-weight:700; cursor:pointer;
  box-shadow:var(--sh-subtle); transition:background .15s;
}
.btn-primary:hover{background:var(--primary-pressed)}

/* ---------- section ---------- */
.sec-head{display:flex; align-items:baseline; gap:var(--sp-sm); margin-bottom:var(--sp-md)}
.sec-head h2{font-size:22px; font-weight:700; letter-spacing:-.01em}
.sec-head .k{font-size:13px; color:var(--tertiary); margin-left:auto}

/* ---------- card-place (white, 20px radius) ---------- */
.card{background:var(--canvas); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-subtle); padding:var(--sp-base)}

/* ---------- flight ---------- */
.rowgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:var(--sp-md)}
.leg-label{font-size:13px; font-weight:600; color:var(--secondary)}
.leg-main{display:flex; align-items:baseline; gap:10px; margin-top:var(--sp-sm)}
.leg-time{font-size:28px; font-weight:700; color:var(--heading); letter-spacing:-.02em}
.leg-port{font-size:16px; color:var(--body); font-weight:600}
.leg-tz{font-size:13px; color:var(--tertiary); margin-top:2px}
.leg-meta{display:flex; flex-wrap:wrap; gap:var(--sp-sm); margin-top:var(--sp-md)}
.kv{font-size:13px; color:var(--secondary)}
.kv b{color:var(--heading); font-weight:600}

/* ---------- stay ---------- */
.stay-name{font-size:19px; font-weight:700; color:var(--heading)}
.stay-zh{margin-top:6px}
.stay-addr{margin-top:var(--sp-sm); font-size:14px; color:var(--secondary); line-height:1.5}

.inout{flex:1 1 150px; background:var(--surface); border-radius:var(--r-sm); padding:var(--sp-md)}
.inout-l{font-size:12px; color:var(--secondary); font-weight:600}
.inout-v{font-size:19px; font-weight:700; color:var(--heading); margin-top:2px}
.inout-d{font-size:13px; color:var(--tertiary); margin-top:1px}

/* ---------- zh chip (neutral — 블루는 인터랙션 전용) ---------- */
.zh{display:inline-flex; border-radius:var(--r-sm); background:var(--surface); overflow:hidden; max-width:100%}
.zh-t{padding:5px 10px; font-size:14px; color:var(--body); line-height:1.4; word-break:break-word}
.zh-b{flex:none; min-height:32px; padding:0 10px; border:0; border-left:1px solid var(--border); background:transparent; color:var(--tertiary); font-size:12px; font-weight:600; cursor:pointer}
.zh-b:hover{color:var(--primary); background:var(--blue-wash)}
.zh-b.ok{color:var(--success)}

/* ---------- day header ---------- */
.dayhead{display:flex; align-items:baseline; gap:var(--sp-sm)}
.dayhead .n{font-size:26px; font-weight:700; color:var(--heading); letter-spacing:-.01em}
.dayhead .d{font-size:15px; color:var(--secondary)}
.dayhead .c{margin-left:auto; font-size:13px; color:var(--tertiary)}

.tl{display:flex; flex-direction:column; gap:var(--sp-lg); margin-top:var(--sp-lg)}
.item-head{display:flex; align-items:baseline; gap:8px}
.item-time{font-size:17px; font-weight:700; color:var(--heading)}
.item-time.none{color:var(--tertiary); font-weight:600}
.item-kind{font-size:13px; color:var(--secondary); font-weight:500}
.item-kind::before{content:"·"; margin-right:8px; color:var(--tertiary)}
.item-card{margin-top:var(--sp-sm)}
.item-title{font-size:17px; font-weight:700; color:var(--heading); line-height:1.4}
.item-note{

.places{display:flex; flex-direction:column; margin-top:var(--sp-md)}
.place{padding-top:var(--sp-md); border-top:1px solid var(--border)}

.place-desc{font-size:12px; font-weight:600; color:var(--tertiary); letter-spacing:.02em}

.place-zh{margin-top:8px}
.place-meta{display:flex; flex-direction:column; gap:5px; margin-top:8px}
.meta-row{display:flex; gap:8px; font-size:14px; color:var(--secondary); line-height:1.5}
.meta-l{flex:none; color:var(--tertiary); font-size:13px; padding-top:1px}
.meta-v{word-break:break-word; white-space:pre-line}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--sp-lg)}

.box{flex:none; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border-strong); display:grid; place-items:center}
.box svg{opacity:0; transform:scale(.7); transition:.14s}
.chk[aria-pressed="true"] .box{background:var(--success); border-color:var(--success)}

.chk[aria-pressed="true"] .chk-t{color:var(--tertiary); text-decoration:line-through}

footer{margin-top:var(--sp-xl); padding-top:var(--sp-base); border-top:1px solid var(--border); font-size:13px; color:var(--tertiary); line-height:1.7}

  .card{padding:var(--sp-md)}

}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>

function placeHTML(p){
  var out = '<div class="place">';
  if(p.desc) out += '<div class="place-desc">'+esc(p.desc)+'</div>';
  if(p.name) out += '<div class="place-name">'+esc(p.name)+'</div>';
  if(p.zh && p.zh !== p.name) out += '<div class="place-zh">'+zhChip(p.zh)+'</div>';
  var meta = "";
  if(p.addr) meta += '<div class="meta-row"><span class="meta-l">주소</span><span class="meta-v">'+esc(p.addr)+'</span></div>';
  if(p.note) meta += '<div class="meta-row"><span class="meta-l">메모</span><span class="meta-v">'+esc(p.note)+'</span></div>';
  if(p.link) meta += '<div class="meta-row"><span class="meta-l">참고</span><span class="meta-v"><a href="'+esc(p.link)+'" target="_blank" rel="noopener">블로그 글 보기</a></span></div>';
  if(meta) out += '<div class="place-meta">'+meta+'</div>';
  out += '<a class="btn'+(p.map?"":" ghost")+'" href="'+esc(amap(p))+'" target="_blank" rel="noopener">'+ICON_MAP
      + (p.map ? "고덕지도" : "고덕지도 검색") + '</a>';
  out += '</div>';
  return out;
}

function blockHTML(b){
  var t = b.time ? '<span class="item-time tnum">'+esc(b.time)+'</span>' : '<span class="item-time none">시간 미정</span>';
  var out = '<div><div class="item-head">'+t+'<span class="item-kind">'+KINDLABEL[b.kind]+'</span></div>';
  out += '<div class="card item-card"><div class="item-title">'+esc(b.title)+'</div>';
  if(b.note) out += '<div class="item-note">'+esc(b.note)+'</div>';
  if(b.places && b.places.length){
    out += '<div class="places">' + b.places.map(placeHTML).join("") + '</div>';
  }
  out += '</div></div>';
  return out;
}

function dayHTML(d){
  var count = 0;
  d.blocks.forEach(function(b){ count += (b.places?b.places.length:0); });
  var out = '<div class="dayhead"><span class="n">'+esc(d.label)+'</span>'
    + '<span class="d tnum">'+esc(d.date)+' ('+esc(d.dow)+')</span>'
    + '<span class="c">장소 '+count+'곳</span></div>';
  out += '<div class="tl">' + d.blocks.map(blockHTML).join("") + '</div>';
  return out;
}

        return '<div class="ovday"><div class="ovday-h"><span class="ovday-n tnum">'+esc(d.date)+'</span><span class="ovday-d">('+esc(d.dow)+')</span></div>'
          + '<div class="ovlist">' + d.rows.map(function(r){
              return '<div class="ovrow"><span class="t tnum">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';
            }).join("") + '</div></div>';
      }).join("")
    + '</div></div></section>';

  var totalPack = 0; Object.keys(PACK).forEach(function(k){ totalPack += PACK[k].length; });
  out += '<section><div class="sec-head"><h2>준비물</h2><span class="k" id="packCount">0 / '+totalPack+'</span></div>'
    + '<div class="card"><div class="cols">'
    + Object.keys(PACK).map(function(g){
        return '<div><div class="col-l">'+esc(g)+'</div><div class="checks">'
          + PACK[g].map(function(item){
              var id = g+"::"+item;
              return '<button class="chk" type="button" data-pack="'+esc(id)+'" aria-pressed="false">'
                + '<span class="box">'+ICON_CHECK+'</span><span class="chk-t">'+esc(item)+'</span></button>';
            }).join("")
          + '</div></div>';
      }).join("")
    + '</div></div></section>';

  return out;
}

/* ---------- 갈 곳들 ---------- */
function wishHTML(){
  var out = '<div class="dayhead"><span class="n">갈 곳들</span><span class="d">아직 일정에 안 넣은 후보</span></div>';
  out += '<div class="card wish" style="margin-top:16px">'
    + WISH.map(function(w){
        var o = '<div class="wrow"><span class="wtag">'+esc(w.cat)+'</span><div class="wmain">'
          + '<div class="wname">'+esc(w.name)+'</div>';
        if(w.en && w.en !== w.name) o += '<div class="wsub">'+esc(w.en)+'</div>';
        if(w.addr) o += '<div class="wsub">'+esc(w.addr)+'</div>';
        if(w.note) o += '<div class="wsub">'+esc(w.note)+'</div>';
        o += '<a class="btn ghost" href="https://www.amap.com/search?query='+encodeURIComponent(w.q)+'" target="_blank" rel="noopener">'+ICON_MAP+'고덕지도 검색</a>';
        o += '</div></div>';
        return o;
      }).join("")
    + '</div>';
  return out;
}

/* ============ 렌더 ============ */
var TABS = [{id:"sum", t:"요약"}]
  .concat(DAYS.map(function(d){ return {id:d.id, t:d.label}; }))
  .concat([{id:"wish", t:"갈 곳들"}]);

var tabsEl = document.getElementById("tabs");
var panelsEl = document.getElementById("panels");

tabsEl.innerHTML = TABS.map(function(t){
  return '<button class="tab" type="button" role="tab" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-selected="false" aria-controls="panel-'+t.id+'">'+esc(t.t)+'</button>';
}).join("");

panelsEl.innerHTML = TABS.map(function(t){
  var body = t.id === "sum" ? summaryHTML()
           : t.id === "wish" ? wishHTML()
           : dayHTML(DAYS.filter(function(d){ return d.id === t.id; })[0]);
  return '<div class="panel" id="panel-'+t.id+'" role="tabpanel" aria-labelledby="tab-'+t.id+'" hidden>'+body+'</div>';
}).join("");

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

function select(id){
  TABS.forEach(function(t){
    var tab = document.getElementById("tab-"+t.id);
    var panel = document.getElementById("panel-"+t.id);
    var on = t.id === id;
    tab.setAttribute("aria-selected", on ? "true" : "false");
    panel.hidden = !on;
  });
  store("sh26.tab", id);
  var el = document.querySelector('[data-tab="'+id+'"]');
  if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest", inline:"nearest"});
}

tabsEl.addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]");
  if(b){ select(b.getAttribute("data-tab")); window.scrollTo({top:0, behavior:"smooth"}); }
});

var saved = store("sh26.tab");
select(saved && TABS.some(function(t){ return t.id === saved; }) ? saved : "sum");

/* 준비물 체크 */
function packState(){
  try{ return JSON.parse(store("sh26.pack") || "{}") || {}; }catch(e){ return {}; }
}
function packCount(){
  var s = packState(), n = 0;
  document.querySelectorAll("[data-pack]").forEach(function(b){ if(s[b.getAttribute("data-pack")]) n++; });
  var el = document.getElementById("packCount");
  if(el) el.textContent = n + el.textContent.slice(el.textContent.indexOf(" / "));
}
(function initPack(){
  var s = packState();
  document.querySelectorAll("[data-pack]").forEach(function(b){
    if(s[b.getAttribute("data-pack")]) b.setAttribute("aria-pressed","true");
  });
  packCount();
})();
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-pack]");
  if(!b) return;
  var on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  var s = packState();
  if(on) s[b.getAttribute("data-pack")] = 1; else delete s[b.getAttribute("data-pack")];
  store("sh26.pack", JSON.stringify(s));
  packCount();
});

/* 중국어 이름 복사 */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-copy]");
  if(!b) return;
  var text = b.getAttribute("data-copy");
  var done = function(){
    b.textContent = "복사됨";
    b.classList.add("ok");
    setTimeout(function(){ b.textContent = "복사"; b.classList.remove("ok"); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }catch(err){
      b.textContent = "길게 눌러 복사";
      setTimeout(function(){ b.textContent = "복사"; }, 1800);
    }
  }
});

</script>
